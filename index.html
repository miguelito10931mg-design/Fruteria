<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2E7D32">
  <meta name="description" content="Mi Frutería — Frutas y verduras frescas a domicilio.">
  <title>Mi Frutería — Frescura a tu mesa</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/icon-192.png">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- ============ TIENDA ============ -->
  <div id="app-store">
    <header class="app-header" role="banner">
      <div class="app-header__brand">
        <img src="/assets/img/logo.svg" alt="" class="app-header__logo" width="36" height="36">
        <span class="app-header__name" data-bind="business.name">Mi Frutería</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a href="#/admin" class="btn btn--ghost btn--sm" title="Panel admin">⚙️</a>
        <button class="app-header__cart-btn" id="btn-cart" aria-label="Abrir carrito">
          <span aria-hidden="true">🛒</span>
          <span class="cart-badge" id="cart-count" hidden>0</span>
        </button>
      </div>
    </header>

    <div class="search-bar" role="search">
      <input type="search" id="search-input" placeholder="Buscar frutas, verduras…"
             aria-label="Buscar productos" autocomplete="off">
    </div>

    <main id="main" class="app-main" role="main">
      <div id="view" aria-live="polite"></div>
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="Navegación principal">
      <a href="#/" class="bottom-nav__item" data-nav="home">
        <span aria-hidden="true">🏠</span><span>Inicio</span>
      </a>
      <a href="#/catalog" class="bottom-nav__item" data-nav="catalog">
        <span aria-hidden="true">🥬</span><span>Catálogo</span>
      </a>
      <a href="#/cart" class="bottom-nav__item" data-nav="cart">
        <span aria-hidden="true">🛒</span><span>Carrito</span>
      </a>
      <a href="#/account" class="bottom-nav__item" data-nav="account">
        <span aria-hidden="true">👤</span><span>Cuenta</span>
      </a>
    </nav>
  </div>

  <!-- ============ PANEL ADMIN ============ -->
  <div id="app-admin" class="hidden">
    <header class="app-header" role="banner">
      <div class="app-header__brand">
        <span>⚙️ Panel Admin</span>
      </div>
      <a href="#/" class="btn btn--ghost btn--sm" id="btn-exit-admin">Salir</a>
    </header>
    <main class="app-main" id="admin-view"></main>
    <nav class="bottom-nav" role="navigation" aria-label="Navegación admin">
      <a href="#/admin" class="bottom-nav__item" data-nav="admin-dash">
        <span>📊</span><span>Dashboard</span>
      </a>
      <a href="#/admin/products" class="bottom-nav__item" data-nav="admin-prod">
        <span>🥬</span><span>Productos</span>
      </a>
      <a href="#/admin/orders" class="bottom-nav__item" data-nav="admin-orders">
        <span>📦</span><span>Pedidos</span>
      </a>
      <a href="#/admin/settings" class="bottom-nav__item" data-nav="admin-settings">
        <span>⚙️</span><span>Ajustes</span>
      </a>
    </nav>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
