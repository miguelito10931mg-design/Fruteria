<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Panel — Mi Frutería</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <style>.admin-top{background:var(--brand-dark);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}.admin-tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:30}.admin-tabs button{flex:none;border:0;background:#EFF5EE;color:var(--brand-dark);font-weight:700;padding:9px 16px;border-radius:999px;font-size:13px}.admin-tabs button.active{background:var(--brand);color:#fff}.admin-body{max-width:1100px;margin:0 auto;padding:14px}.admin-login{max-width:400px;margin:60px auto}</style>
</head>
<body>
  <header class="admin-top"><b>🧺 Panel Mi Frutería</b><span id="admin-who" style="font-size:13px;opacity:.85"></span></header>
  <nav class="admin-tabs" id="admin-tabs" hidden>
    <button data-tab="dash" class="active">📊 Dashboard</button>
    <button data-tab="orders">📦 Pedidos</button>
    <button data-tab="products">🥕 Productos</button>
    <button data-tab="cats">🗂️ Categorías</button>
    <button data-tab="zones">🚚 Zonas</button>
    <button data-tab="promos">🏷️ Promos</button>
    <button data-tab="settings">⚙️ Ajustes</button>
  </nav>
  <main class="admin-body" id="admin-main"></main>
  <div id="toasts" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
